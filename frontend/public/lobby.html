<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NOVA — Lobby Display</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:#050505;color:#F4F2EC;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
.fd{font-family:'Montserrat',sans-serif;}
.lobby{position:relative;width:100%;height:100vh;overflow:hidden;}
.header{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:linear-gradient(180deg,rgba(5,5,5,.92) 0%,transparent 100%);}
.logo-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(201,151,43,.35);}
.brand{font-size:17px;font-weight:700;letter-spacing:.06em;}
.brand span{color:#F4C95D;}
.live{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#1D9E75;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#1D9E75;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.clock{font-size:12px;color:rgba(244,242,236,.4);font-variant-numeric:tabular-nums;}

.view{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;pointer-events:none;}
.view.active{opacity:1;pointer-events:auto;}

/* Gallery */
.g-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease;}
.g-img.show{opacity:1;}
.g-overlay{position:absolute;bottom:70px;left:0;right:0;padding:24px 28px;background:linear-gradient(transparent,rgba(5,5,5,.88));z-index:2;}
.g-caption{font-size:22px;font-weight:700;}
.g-barber{font-size:14px;color:rgba(244,242,236,.55);margin-top:4px;}
.g-svc{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 12px;border-radius:999px;background:rgba(201,151,43,.15);color:#F4C95D;border:1px solid rgba(201,151,43,.3);margin-top:10px;}
.g-counter{position:absolute;right:20px;top:50%;transform:translateY(-50%);z-index:3;font-size:12px;color:rgba(244,242,236,.2);writing-mode:vertical-lr;}
.g-strip{position:absolute;bottom:0;left:0;right:0;z-index:10;display:flex;gap:6px;padding:12px 28px;background:rgba(5,5,5,.95);overflow-x:auto;}
.g-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;border:2px solid transparent;cursor:pointer;opacity:.4;transition:.3s;flex:none;}
.g-thumb.active{border-color:#C9972B;opacity:1;}

/* Calendar */
.cal-wrap{padding:70px 24px 24px;height:100%;overflow-y:auto;}
.cal-title{font-size:17px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.cal-stats{display:flex;gap:8px;margin-bottom:12px;}
.cal-stat{background:#111111;border:1px solid rgba(244,242,236,.1);border-radius:10px;padding:10px 14px;flex:1;text-align:center;}
.cal-sv{font-size:20px;font-weight:600;}
.cal-sl{font-size:10px;color:rgba(244,242,236,.4);margin-top:2px;}
.cal-occ{height:6px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden;margin-bottom:14px;}
.cal-occ-f{height:100%;border-radius:999px;transition:.5s;}
.cal-legend{display:flex;gap:14px;margin-bottom:12px;}
.cal-li{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(244,242,236,.4);}
.cal-ld{width:10px;height:10px;border-radius:3px;}
.cal-grid{display:grid;gap:0;font-size:11px;}
.cal-gh{text-align:center;padding:8px 4px;background:#111111;border-bottom:1px solid rgba(244,242,236,.1);font-weight:600;}
.cal-gt{padding:0 5px;display:flex;align-items:center;color:rgba(244,242,236,.35);font-variant-numeric:tabular-nums;border-right:1px solid rgba(244,242,236,.1);}
.cal-gc{border:1px solid rgba(244,242,236,.06);padding:3px 4px;min-height:28px;display:flex;flex-direction:column;justify-content:center;}
.cal-gc.bk{background:rgba(201,151,43,.06);border-color:rgba(201,151,43,.15);}
.cal-gc.cp{background:rgba(29,158,117,.05);border-color:rgba(29,158,117,.12);}
.cal-gc .sv{font-weight:600;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-gc.bk .sv{color:#C9972B;}
.cal-gc.cp .sv{color:#1D9E75;}
.cal-gc .cl{font-size:8px;color:rgba(244,242,236,.25);}

.pills{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;}
.pill{height:8px;border-radius:4px;transition:.3s;cursor:pointer;}
.pill.on{width:28px;background:#F4C95D;}
.pill.off{width:8px;background:rgba(244,242,236,.2);}
</style>
</head>

  const rng=seed(42);const times=[];
  for(let h=8;h<20;h++)for(let m of[0,30])times.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));
  const grid=times.map(t=>{const cells=CHAIRS.map(()=>{const r=rng();if(r<.35){const sv=SVCS[Math.floor(rng()*4)];const ini=INI[Math.floor(rng()*8)];return{st:rng()<.12?'cp':'bk',sv,ini};}return{st:''};});return{t,cells};});
  const total=times.length*CHAIRS.length,booked=grid.reduce((s,r)=>s+r.cells.filter(c=>c.st).length,0),free=total-booked,pct=Math.round(booked/total*100);
  const occC=pct>70?'#E24B4A':pct>40?'#C9972B':'#1D9E75';
  document.getElementById('v-cal').innerHTML='<div class="cal-wrap">'
    +'<div class="cal-title fd">📅 Disponibilidad hoy — NOVA Chapinero</div>'
    +'<div class="cal-stats">'
    +'<div class="cal-stat"><div class="cal-sv fd" style="color:'+occC+'">'+pct+'%</div><div class="cal-sl">Ocupación</div></div>'
    +'<div class="cal-stat"><div class="cal-sv fd" style="color:#F4C95D">'+booked+'</div><div class="cal-sl">Reservados</div></div>'
    +'<div class="cal-stat"><div class="cal-sv fd" style="color:#1D9E75">'+free+'</div><div class="cal-sl">Disponibles</div></div>'
    +'<div class="cal-stat"><div class="cal-sv fd">'+CHAIRS.length+'</div><div class="cal-sl">Sillas</div></div>'
    +'</div>'
    +'<div class="cal-occ"><div class="cal-occ-f" style="width:'+pct+'%;background:'+occC+'"></div></div>'
    +'<div class="cal-legend">'
    +'<div class="cal-li"><div class="cal-ld" style="border:1px solid rgba(244,242,236,.15)"></div>Libre</div>'
    +'<div class="cal-li"><div class="cal-ld" style="background:rgba(201,151,43,.25)"></div>Reservado</div>'
    +'<div class="cal-li"><div class="cal-ld" style="background:rgba(29,158,117,.25)"></div>Completado</div>'
    +'</div>'
    +'<div style="overflow-x:auto;border-radius:10px;border:1px solid rgba(244,242,236,.1);"><div class="cal-grid" style="grid-template-columns:48px '+'1fr '.repeat(CHAIRS.length)+';">'
    +'<div class="cal-gh" style="border-right:1px solid rgba(244,242,236,.1)">Hora</div>'
    +CHAIRS.map(c=>'<div class="cal-gh"><div>'+c.l+'</div><div style="font-size:9px;color:rgba(244,242,236,.35);font-weight:400">'+c.b+'</div></div>').join('')
    +grid.map(r=>'<div class="cal-gt">'+r.t+'</div>'+r.cells.map(c=>'<div class="cal-gc '+c.st+'">'+(c.st?'<div class="sv">'+c.sv+'</div><div class="cl">'+c.ini+'</div>':'')+'</div>').join('')).join('')
    +'</div></div>'
    +'<div style="text-align:center;margin-top:16px;font-size:12px;color:rgba(244,242,236,.25)">Reserva en línea · novabarbershop.com</div>'
    +'</div>';
}

function switchMode(m){
  mode=m;
  document.getElementById('v-gallery').classList.toggle('active',m===0);
  document.getElementById('v-cal').classList.toggle('active',m===1);
  document.getElementById('pills').innerHTML=[0,1].map(i=>'<div class="pill '+(mode===i?'on':'off')+'" onclick="switchMode('+i+');resetMT()"></div>').join('');
  if(m===0){renderGallery();resetPT();}else{clearInterval(pt);}
}

function resetMT(){clearTimeout(mt);mt=setTimeout(()=>switchMode(mode===0?1:0),mode===0?40000:20000);}

renderGallery();renderCal();switchMode(0);resetPT();resetMT();
</script>
